spring.application.name=biblioteca
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/biblioteca_nucleo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblioteca}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:biblioteca}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
app.mail.from=${APP_MAIL_FROM:noreply@biblioteca.local}
app.emprestimos.atraso.cron=${APP_EMPRESTIMOS_ATRASO_CRON:0 0 9 * * *}
spring.kafka.producer.acks=all
app.kafka.topics.emprestimos=${APP_KAFKA_TOPICS_EMPRESTIMOS:biblioteca.emprestimos}
