name: biblioteca

services:
  postgres-nucleo:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca_nucleo
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata-nucleo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca} -d biblioteca_nucleo"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-relatorio:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca_relatorio
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata-relatorio:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca} -d biblioteca_relatorio"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic biblioteca.emprestimos --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic biblioteca.emprestimos.DLT --partitions 1 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"

  api-nucleo:
    build:
      context: ./biblioteca-nucleo
    restart: unless-stopped
    depends_on:
      postgres-nucleo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-nucleo:5432/biblioteca_nucleo
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-biblioteca}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_ACKS: all
      APP_KAFKA_TOPICS_EMPRESTIMOS: biblioteca.emprestimos
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      TZ: UTC
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api-nucleo:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/api-nucleo.conf:/etc/nginx/conf.d/default.conf:ro

  api-relatorio:
    build:
      context: ./biblioteca-relatorio
    restart: unless-stopped
    depends_on:
      postgres-relatorio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-relatorio:5432/biblioteca_relatorio
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-biblioteca}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: biblioteca-relatorio
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      APP_KAFKA_TOPICS_EMPRESTIMOS: biblioteca.emprestimos
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      TZ: UTC
    ports:
      - "8081-8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata-nucleo:
  pgdata-relatorio:
  kafka-data: