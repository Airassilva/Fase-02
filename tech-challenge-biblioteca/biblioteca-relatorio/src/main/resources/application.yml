spring:
  application:
    name: biblioteca-relatorio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/biblioteca_relatorio}
    username: ${SPRING_DATASOURCE_USERNAME:biblioteca}
    password: ${SPRING_DATASOURCE_PASSWORD:biblioteca}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: biblioteca-relatorio
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  kafka:
    topics:
      emprestimos: ${APP_KAFKA_TOPICS_EMPRESTIMOS:biblioteca.emprestimos}
  relatorio:
    cron: ${APP_RELATORIO_CRON:0 */5 * * * *}
